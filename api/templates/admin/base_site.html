{% extends "admin/base.html" %}

{% block title %}{% if subtitle %}{{ subtitle }} · {% endif %}{{ title }} · MorningCart{% endblock %}

{% block branding %}
<div id="site-name">
  <a href="{% url 'admin:index' %}">🌅 MorningCart <span style="opacity:.55;font-weight:400">· the back office</span></a>
</div>
{% endblock %}

{% block extrastyle %}
<style>
  /* The morning counter, translated to admin CSS vars.
     EVERY variable Django defines is set here (a partial override mixes with
     the OS dark theme and produces light-on-light inputs), and the selector
     list ties/beats both dark_mode.css blocks so the palette is identical in
     every scheme. The admin is light by identity — the toggle is hidden. */
  :root,
  html[data-theme="auto"],
  html[data-theme="light"],
  html[data-theme="dark"] {
    color-scheme: light;

    --primary: #A1431E;
    --secondary: #2A2018;
    --accent: #C68A2E;
    --primary-fg: #FFFDF8;

    --body-fg: #2A2018;
    --body-bg: #FCF8EF;
    --body-quiet-color: #6E5E44;
    --body-medium-color: #46402F;
    --body-loud-color: #1A140E;

    --header-color: #F4ECDB;
    --header-branding-color: #FFFDF8;
    --header-bg: #2A2018;
    --header-link-color: #F4ECDB;

    --breadcrumbs-fg: #F6E7DC;
    --breadcrumbs-link-fg: #FFFDF8;
    --breadcrumbs-bg: #A1431E;

    --link-fg: #A1431E;
    --link-hover-color: #C0552B;
    --link-selected-fg: #8C3A1A;

    --hairline-color: #E3D6BE;
    --border-color: #A08F6C;

    --error-fg: #9E2B1E;

    --message-success-bg: #E7EBD8;
    --message-warning-bg: #F4E7C8;
    --message-error-bg: #F6E7DC;

    --darkened-bg: #F4ECDB;
    --selected-bg: #EFE6D2;
    --selected-row: #F6E7DC;

    --button-fg: #FFFDF8;
    --button-bg: #A1431E;
    --button-hover-bg: #8C3A1A;
    --default-button-bg: #2A2018;
    --default-button-hover-bg: #46402F;
    --close-button-bg: #6E5E44;
    --close-button-hover-bg: #2A2018;
    --delete-button-bg: #9E2B1E;
    --delete-button-hover-bg: #7C2218;
    --object-tools-fg: #FFFDF8;
    --object-tools-bg: #2A2018;
    --object-tools-hover-bg: #46402F;
  }

  /* single light theme -> the toggle would be a no-op; remove it */
  .theme-toggle { display: none !important; }

  #site-name a { font-family: Georgia, 'Times New Roman', serif; letter-spacing: -0.01em; }
  #content h1 { font-family: Georgia, 'Times New Roman', serif; }
</style>
{% endblock %}
