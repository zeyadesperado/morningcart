name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API · property + endpoint tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: morningcart
          POSTGRES_PASSWORD: morningcart
          POSTGRES_DB: morningcart
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U morningcart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://morningcart:morningcart@localhost:5432/morningcart
      COOKIE_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Money invariant (hypothesis property tests, no DB)
        run: python -m unittest breakfast.tests.test_domain -v
      - name: Endpoint + admin tests
        run: python manage.py test breakfast -v 1

  web:
    name: Web · typecheck + fast-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Money invariant (fast-check property tests)
        run: npm test
      - run: npm run build
