# MorningCart — production-shaped local stack.
#   docker compose up --build   ->   web at http://localhost:8080
# web (nginx) is the only published port; it reverse-proxies /api/ to the api
# service so the auth cookie is always same-origin.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: morningcart
      POSTGRES_PASSWORD: morningcart
      POSTGRES_DB: morningcart
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morningcart -d morningcart"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://morningcart:morningcart@db:5432/morningcart
      # No baked-in secret: set COOKIE_SECRET in the environment (e.g. `openssl rand -hex 32`).
      # Compose fails loudly if it is unset, so a forgeable default can never ship.
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET (openssl rand -hex 32)}
      DEBUG: "false"
      PORT: "4000"
      # Safe on every restart: seed is a no-op when data already exists
      # (wipe + reseed explicitly with: docker compose exec api python manage.py seed --force)
      SEED_ON_BOOT: "true"
      # Django admin at /admin — set both to auto-create the superuser on boot
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Required for admin logins through an HTTPS tunnel/proxy origin,
      # e.g. CSRF_TRUSTED_ORIGINS=https://breakfast.example.com
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
