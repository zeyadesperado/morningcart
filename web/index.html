<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- the link is the only access control — keep it out of search indexes -->
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#F4ECDB" />
    <title>MorningCart — breakfast, sorted · فطار؟</title>
    <meta
      name="description"
      content="Group breakfast for the team: everyone taps their order, anyone closes it, the split is exact to the piaster. No coordinator, no arithmetic."
    />

    <!-- icons + installability (add to home screen) -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MorningCart" />

    <!-- link preview (WhatsApp / Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MorningCart — breakfast, sorted · فطار؟" />
    <meta
      property="og:description"
      content="Tap your order, see who's in, split the delivery to the exact piaster. Breakfast without the coordinator."
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* first-paint matches the app paper — no white flash before JS/CSS load */
      html {
        background-color: #f4ecdb;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- static splash: brand shows from the first paint; React replaces it -->
      <div style="min-height: 100dvh; display: grid; place-items: center; font-family: Georgia, 'Times New Roman', serif">
        <div style="text-align: center">
          <img src="/icon.svg" alt="" width="56" height="56" style="display: inline-block" />
          <p style="margin: 10px 0 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: #2a2018">
            MorningCart
          </p>
          <p style="margin: 4px 0 0; font-size: 12px; color: #6e5e44">breakfast, sorted · صباح الفول</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
