# MorningCart web — static SPA + same-origin reverse proxy to the api service.
# Cookies are same-origin because the browser only ever talks to this server;
# /api/ requests are proxied server-side to http://api:4000.

# Brute-force damping for the admin login (per source IP).
limit_req_zone $binary_remote_addr zone=adminlogin:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # SPA: serve files when present, otherwise fall back to index.html.
    # index.html must revalidate — a stale shell would reference deleted
    # hashed bundles after a redeploy (white screen on installed PWAs).
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # Vite emits content-hashed filenames — cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy the API. Path is preserved (api routes are mounted at /api).
    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # Django admin (auth-protected) + its static assets (whitenoise via gunicorn).
    # Bare /admin would otherwise fall through to the SPA — redirect it.
    location = /admin {
        return 301 /admin/;
    }
    # $http_host (NOT $host) — it keeps the port, so Django's CSRF origin
    # check can match Origin: http://host:8080 against the Host header.
    # The login endpoint is rate-limited — Django ships no brute-force protection.
    location = /admin/login/ {
        limit_req zone=adminlogin burst=10 nodelay;
        proxy_pass http://api:4000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }
    location /admin/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }
    location /static/ {
        proxy_pass http://api:4000;
    }
}
