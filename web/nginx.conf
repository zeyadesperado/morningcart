# MorningCart web — static SPA + same-origin reverse proxy to the api service.
# Cookies are same-origin because the browser only ever talks to this server;
# /api/ requests are proxied server-side to http://api:4000.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # SPA: serve files when present, otherwise fall back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # Vite emits content-hashed filenames — cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy the API. Path is preserved (api routes are mounted at /api).
    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }
}
